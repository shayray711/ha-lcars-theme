  lcars-banner-bg: "linear-gradient(90deg, #5b8df0 0 55%, #f5c9a0 55% 70%, #ef9a7a 70% 85%, #e06a77 85%) top / 100% 18px no-repeat, #000"
  lcars-banner-size: "100% 18px, 100% 100%"
  lcars-banner-left: "40px solid #5b8df0"
  lcars-banner-radius: "90px 8px 8px 8px"
  lcars-banner-bottom: "6px solid #ef9a7a"
  lcars-banner-pad: "30px 14px 8px"
  lcars-banner-color: "#e8eef6"
  lcars-banner-shadow: "none"
  lcars-banner-time: "#cfe4fb"
  lcars-banner-greet: "#f5c9a0"
  lcars-banner-date: "#ef9a7a"
  lcars-banner-caps: "uppercase"
  lcars-banner-anim: "none"
  lcars-banner-track: "0.12em"

  lovelace-background: "#000000"
  primary-background-color: "#000000"
  secondary-background-color: "#06050a"
  app-header-background-color: "#000000"
  primary-text-color: "#e8eef6"
  secondary-text-color: "#f5c9a0"
  disabled-text-color: "#5e5468"
  text-primary-color: "#000000"
  primary-font-family: "Antonio, 'Arial Narrow', sans-serif"
  paper-font-common-base_-_font-family: "Antonio, 'Arial Narrow', sans-serif"
  ha-font-family-body: "Antonio, 'Arial Narrow', sans-serif"
  ha-font-family-heading: "Antonio, 'Arial Narrow', sans-serif"
  primary-color: "#5b8df0"
  accent-color: "#ef9a7a"
  state-icon-color: "#f5c9a0"
  state-light-on-color: "#5b8df0"
  state-climate-heat-color: "#e3655b"
  card-background-color: "#000000"
  ha-card-background: "#000000"
  ha-card-border-radius: "34px"
  ha-card-border-width: "0px"
  ha-card-box-shadow: "none"
  divider-color: "#241d2c"
  sidebar-background-color: "#000000"
  sidebar-text-color: "#cfe4fb"
  sidebar-icon-color: "#5b8df0"
  sidebar-selected-background-color: "rgba(91, 141, 240, 0.25)"
  sidebar-selected-text-color: "#5b8df0"
  sidebar-selected-icon-color: "#5b8df0"
  dialog-background-color: "#06050a"
  input-fill-color: "#16181c"
  ha-color-form-background: "#16181c"
  ha-color-form-background-hover: "#1d2026"
  ha-color-form-background-disabled: "#0e0f12"
  ha-color-text-secondary: "#9fb4cc"
  ha-color-text-primary: "#e8eef6"
  input-ink-color: "#e8eef6"
  input-label-ink-color: "#9fb4cc"
  input-idle-line-color: "#5b8df0"
  input-disabled-ink-color: "#566170"
  mdc-text-field-fill-color: "#16181c"
  mdc-text-field-ink-color: "#e8eef6"
  mdc-text-field-label-ink-color: "#9fb4cc"
  mdc-text-field-idle-line-color: "#5b8df0"
  mdc-select-fill-color: "#16181c"
  mdc-select-ink-color: "#e8eef6"
  mdc-theme-surface: "#111214"
  mdc-theme-on-surface: "#e8eef6"
  mdc-theme-text-primary-on-background: "#e8eef6"
  assist-chat-user-bubble-color: "#5b8df0"
  assist-chat-hass-bubble-color: "#1b1e24"

  card-mod-theme: LCARS Console
  card-mod-root: |
    {% if user == 'Tablet' and is_state('schedule.tablet_night_mode', 'on') %}
    :host { filter: grayscale(1) sepia(1) saturate(6) hue-rotate(-50deg) brightness(0.45) contrast(1.1); }
    {% endif %}
    .toolbar, app-toolbar, .header {
      background: #000 !important;
      border-bottom: 3px solid #5b8df0; border-image: linear-gradient(90deg, #5b8df0 0 55%, #f5c9a0 55% 70%, #ef9a7a 70% 85%, #e06a77 85%) 1;
      border-radius: 0 0 0 0;
      box-shadow: none;
    }
    sl-tab, ha-tab, paper-tab { text-transform: uppercase; font-family: Antonio, sans-serif; color: #f5c9a0; }
  card-mod-card: |
    ha-card {
      background: #000;
      border-left: 4px solid var(--lcars-accent, #5b8df0);
      border-top: 3px solid var(--lcars-accent, #5b8df0);
      border-radius: 20px 6px 6px 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      overflow: hidden;
    }
    :host(hui-markdown-card) ha-card { text-transform: none; letter-spacing: normal; }
    :host(hui-heading-card) ha-card { border: 0; border-left: 36px solid #5b8df0; border-top: 5px solid #5b8df0; border-radius: 26px 0 0 0; background: transparent; color: #f5c9a0; letter-spacing: 0.14em; padding: 0 0 0 6px; margin-bottom: 4px; }

