# LCARS-inspired themes for Home Assistant.
# Written from scratch. Inspired by (not copied from) the LCARS look of Star Trek: Picard / TNG
# and by the Pi-hole LCARS community themes. No logos or copyrighted artwork are used.
#
# Font: Antonio (SIL Open Font License 1.1), self-hosted at /local/fonts/antonio/antonio.css.
# Shapes (all-caps text, pill buttons, elbows, side bars) need card-mod. Three themes: Picard LCARS, TNG LCARS, LCARS Console.


Picard LCARS:
  # --- Palette ----------------------------------------------------------
  lcars-black: "#000000"
  lcars-panel: "#05070c"
  lcars-blue: "#5b8fd8"
  lcars-ice: "#a8cdf2"
  lcars-gold: "#e8b04e"
  lcars-amber: "#c98a2b"
  lcars-red: "#c94a3b"
  lcars-text: "#e6eef8"
  lcars-dim: "#7c8aa0"
  # Panel colour families (used by the dashboard's LCARS panels)
  lcars-network: "#5b8fd8"
  lcars-network-2: "#a8cdf2"
  lcars-pihole: "#c94a3b"
  lcars-pihole-2: "#e58a6f"
  lcars-battery: "#e8b04e"
  lcars-battery-2: "#f3d38c"
  lcars-alert: "#c94a3b"
  lcars-readout-size: "3.4em"

  # --- Page -------------------------------------------------------------
  lovelace-background: "#000000"
  primary-background-color: "#000000"
  secondary-background-color: "#05070c"
  app-header-background-color: "#000000"
  app-header-text-color: "#e8b04e"
  app-header-edit-background-color: "#c98a2b"

  # --- Text and fonts ---------------------------------------------------
  primary-text-color: "#e6eef8"
  secondary-text-color: "#a8cdf2"
  disabled-text-color: "#4f5a6b"
  text-primary-color: "#000000"
  primary-font-family: "Antonio, 'Arial Narrow', sans-serif"
  paper-font-common-base_-_font-family: "Antonio, 'Arial Narrow', sans-serif"
  ha-font-family-body: "Antonio, 'Arial Narrow', sans-serif"
  ha-font-family-heading: "Antonio, 'Arial Narrow', sans-serif"

  # --- Accent colours ---------------------------------------------------
  primary-color: "#e8b04e"
  rgb-primary-color: "232, 176, 78"
  accent-color: "#5b8fd8"
  rgb-accent-color: "91, 143, 216"
  state-icon-color: "#a8cdf2"
  state-light-on-color: "#e8b04e"
  state-climate-heat-color: "#c94a3b"
  state-climate-auto-color: "#5b8fd8"
  error-color: "#c94a3b"
  warning-color: "#e8b04e"
  success-color: "#7fb3e8"
  info-color: "#5b8fd8"
  divider-color: "#1b2433"

  # --- Cards ------------------------------------------------------------
  card-background-color: "#000000"
  ha-card-background: "#000000"
  ha-card-border-radius: "28px"
  ha-card-border-width: "0px"
  ha-card-box-shadow: "none"
  ha-card-header-font-family: "Antonio, 'Arial Narrow', sans-serif"
  ha-badge-border-radius: "999px"

  # --- Sidebar and dialogs ----------------------------------------------
  sidebar-background-color: "#000000"
  sidebar-text-color: "#a8cdf2"
  sidebar-icon-color: "#5b8fd8"
  sidebar-selected-background-color: "#e8b04e"
  sidebar-selected-text-color: "#e8b04e"
  sidebar-selected-icon-color: "#e8b04e"
  dialog-background-color: "#05070c"
  mdc-dialog-scrim-color: "rgba(0, 0, 0, 0.75)"
  input-fill-color: "#0b111b"
  input-ink-color: "#e6eef8"
  switch-checked-color: "#e8b04e"
  switch-checked-track-color: "#c98a2b"


  # --- LCARS shapes (needs card-mod) -----------------------------------
  # Every card takes its colour from --lcars-accent. A dashboard can give a panel its
  # own colour family with: card_mod: { style: "ha-card { --lcars-accent: var(--lcars-network); }" }
  card-mod-theme: Picard LCARS
  card-mod-card: &lcars_card_mod |
    ha-card {
      --lcars-bar: var(--lcars-accent, var(--primary-color));
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--lcars-black, #000);
      border-left: 14px solid var(--lcars-bar);
      border-top: 6px solid var(--lcars-bar);
      border-radius: 34px 6px 6px 6px;
      overflow: hidden;
    }
    /* Pill-shaped tiles and buttons with a coloured end cap */
    :host(hui-tile-card) ha-card,
    :host(hui-button-card) ha-card {
      border-top: 0;
      border-left: 22px solid var(--lcars-bar);
      border-radius: 999px;
    }
    /* Headings: no panel, LCARS-style coloured caps */
    :host(hui-heading-card) ha-card {
      border: 0;
      border-radius: 0;
      color: var(--lcars-bar);
      letter-spacing: 0.12em;
      font-size: 1.15em;
    }
    /* Keep running text readable */
    :host(hui-markdown-card) ha-card {
      text-transform: none;
      letter-spacing: normal;
    }

